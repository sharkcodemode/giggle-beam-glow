<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ACTO Music PiP</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #020617;
        color: #dbeafe;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        display: flex;
        flex-direction: column;
        border: 1px solid rgba(59, 130, 246, 0.35);
        box-shadow: inset 0 0 28px rgba(37, 99, 235, 0.22);
      }

      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        height: 34px;
        padding: 0 10px;
        border-bottom: 1px solid rgba(59, 130, 246, 0.22);
        background: rgba(15, 23, 42, 0.95);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
        font-size: 10px;
        font-weight: 900;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: #eff6ff;
      }

      .pulse {
        width: 8px;
        height: 8px;
        border-radius: 999px;
        background: #60a5fa;
        box-shadow: 0 0 14px rgba(96, 165, 250, 0.9);
        animation: pulse 1.4s ease-in-out infinite;
      }

      main {
        position: relative;
        flex: 1;
        min-height: 0;
        background:
          radial-gradient(circle at top left, rgba(37, 99, 235, 0.2), transparent 34%),
          #020617;
      }

      iframe {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
        background: #000;
      }

      .fallback {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        height: 100%;
        padding: 22px;
        text-align: center;
        font-size: 10px;
        font-weight: 800;
        letter-spacing: 0.14em;
        line-height: 1.7;
        text-transform: uppercase;
        color: rgba(219, 234, 254, 0.62);
      }

      .fallback button {
        height: 30px;
        border: 1px solid rgba(96, 165, 250, 0.42);
        border-radius: 6px;
        padding: 0 12px;
        background: rgba(30, 64, 175, 0.28);
        color: #dbeafe;
        font-size: 9px;
        font-weight: 900;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        cursor: pointer;
      }

      @keyframes pulse {
        0%,
        100% {
          transform: scale(0.82);
          opacity: 0.65;
        }

        50% {
          transform: scale(1.15);
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="brand">
        <span class="pulse"></span>
        <span>ACTO MUSIC</span>
      </div>
    </header>
    <main id="player" aria-label="ACTO Music Mini Player"></main>
    <script src="./music-pip.js"></script>
  </body>
</html>
