<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Permitir acesso ao microfone</title>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        background: #020617;
        color: #e5f2ff;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(circle at top, rgba(37, 99, 235, 0.18), transparent 36%),
          #020617;
      }

      main {
        width: min(100%, 460px);
        border: 1px solid rgba(96, 165, 250, 0.28);
        border-radius: 8px;
        padding: 28px;
        background: rgba(15, 23, 42, 0.94);
        box-shadow: 0 20px 70px rgba(0, 0, 0, 0.42);
      }

      h1 {
        margin: 0 0 12px;
        font-size: 22px;
        line-height: 1.2;
        letter-spacing: 0;
      }

      p {
        margin: 0;
        color: rgba(226, 232, 240, 0.78);
        font-size: 14px;
        line-height: 1.55;
      }

      #status {
        margin: 22px 0 18px;
        min-height: 22px;
        color: #93c5fd;
        font-weight: 700;
      }

      #status.success {
        color: #86efac;
      }

      #status.error {
        color: #fca5a5;
      }

      .actions {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }

      button {
        min-height: 40px;
        border: 1px solid rgba(96, 165, 250, 0.55);
        border-radius: 6px;
        padding: 0 16px;
        background: rgba(37, 99, 235, 0.35);
        color: #fff;
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0.08em;
        cursor: pointer;
        transition:
          transform 120ms ease,
          border-color 120ms ease,
          background 120ms ease;
      }

      button:hover {
        background: rgba(37, 99, 235, 0.52);
        border-color: rgba(147, 197, 253, 0.8);
      }

      button:focus-visible {
        outline: 2px solid #60a5fa;
        outline-offset: 3px;
      }

      button:active {
        transform: scale(0.98);
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.62;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Permitir acesso ao microfone</h1>
      <p>
        A ACTO precisa acessar seu microfone para iniciar a conversa por voz.
        Clique no botão abaixo e permita o acesso quando o Chrome solicitar.
      </p>
      <p id="status">Aguardando permissão</p>
      <div class="actions">
        <button id="allowButton" type="button">PERMITIR MICROFONE</button>
        <button id="closeButton" type="button" hidden>FECHAR ESTA ABA</button>
      </div>
    </main>
    <script src="mic-permission.js"></script>
  </body>
</html>
